AWSTemplateFormatVersion: "2010-09-09"
Description: "Database layer for the Book Manager API (RDS Multi-AZ)"

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  DBUsername:
    Type: String
    MinLength: 1
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"
  DBInstanceClass:
    Type: String
    Default: db.t3.small
  DBStorageGB:
    Type: Number
    Default: 20
  DatabasePrivateSubnetIds:
    Type: CommaDelimitedList
  RDSecurityGroupId:
    Type: String

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub book-manager-${EnvironmentName}-db-subnets
      SubnetIds: !Ref DatabasePrivateSubnetIds

  DBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBName: book_manager
      Engine: postgres
      EngineVersion: "17.9"
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBStorageGB
      StorageType: gp2
      StorageEncrypted: true
      MultiAZ: true
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      MasterUsername: !Ref DBUsername
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub book-manager-${EnvironmentName}-db

Outputs:
  DBEndpoint:
    Description: Database endpoint
    Value: !GetAtt DBInstance.Endpoint.Address
    Export:
      Name: !Sub book-manager-${EnvironmentName}-db-endpoint

  DBInstanceIdentifier:
    Description: RDS DB instance identifier
    Value: !Ref DBInstance
    Export:
      Name: !Sub book-manager-${EnvironmentName}-db-instance-id

  DBName:
    Description: Database name
    Value: book_manager
    Export:
      Name: !Sub book-manager-${EnvironmentName}-db-name

  DBPort:
    Description: Database port
    Value: "5432"
    Export:
      Name: !Sub book-manager-${EnvironmentName}-db-port

  DBSecretArn:
    Description: RDS-managed master user secret ARN
    Value: !GetAtt DBInstance.MasterUserSecret.SecretArn
    Export:
      Name: !Sub book-manager-${EnvironmentName}-db-secret-arn
